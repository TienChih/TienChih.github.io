<!DOCTYPE HTML>
<html>

    <script>
    // Make the div with id 'mycell' a Sage cell
    sagecell.makeSagecell({inputLocation:  '#mycell',
                           template:       sagecell.templates.minimal,
                           evalButtonText: 'Activate'});
    // Make *any* div with class 'compute' a Sage cell
    sagecell.makeSagecell({inputLocation: 'div.compute',
                           evalButtonText: 'Evaluate'});

  <body>
  
    <div class="compute"><script type="text/x-sage">
def token_graph(G, r):
    """
    Return the r-token graph of a graph G.
    """
    V = list(G.vertices())
    TG = Graph()

    # vertices are r-subsets of V
    subsets = [Set(S) for S in Subsets(V, r)]
    TG.add_vertices(subsets)

    # edges: symmetric difference = {u, v} with uv in G
    for A in subsets:
        for u in A:
            for v in (Set(V) - A):
                if G.has_edge(u, v):
                    B = (A - Set([u])) + Set([v])
                    if B in subsets:
                        TG.add_edge(A, B)

    return TG

def pleat(G):
    """
    Return the stiff graph of G by recursively deleting vertices v
    for which there exists w ≠ v with N(v) ⊆ N(w).
    """
    H = G.copy()
    changed = True

    while changed:
        changed = False
        vertices = list(H.vertices())

        for v in vertices:
            Nv = set(H.neighbors(v))
            for w in vertices:
                if v != w:
                    Nw = set(H.neighbors(w))
                    if Nv.issubset(Nw):
                        H.delete_vertex(v)
                        changed = True
                        break
            if changed:
                break

    return H

TGP = pleat(token_graph(G,2))

TG.is_isomorphic(TGP)

TG.show()
TGP.show()  </script></div>
