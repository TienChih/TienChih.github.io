<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SET · Affine Geometry Puzzle</title>
<meta name="description" content="Fill a 3x3 or 3x3x3 grid of SET cards so that every line of the finite affine geometry AG(2,3) / AG(3,3) is a SET, then lay out the projective plane PG(2,3).">
<style>
/* ===================== tokens & base ===================== */
:root {
  --bg: #f4f2ec; --bg2: #eae6dc; --panel: #fffefb; --ink: #1b1a17; --ink2: #4a463d;
  --muted: #7a7466; --line: #ded8ca; --line2: #cdc5b3;
  --accent: #4b45c6; --accent-soft: #e8e6fb;
  --good: #16794a; --good-soft: #dff2e6; --bad: #bb2418; --bad-soft: #fbe3e0;
  --c0: #cf1f2d; --c1: #0f8a4d; --c2: #6b2fd6;
  --card-bg: #fffdf7; --card-line: #d9d2c2;
  --shadow: 0 1px 2px rgba(40,34,20,.07), 0 6px 18px -8px rgba(40,34,20,.18);
  --radius: 14px;
  --cw: 58px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141a; --bg2: #0d0f14; --panel: #1a1d25; --ink: #eceaE4; --ink2: #c4c1b8;
    --muted: #8f95a1; --line: #2b303a; --line2: #3b424f;
    --accent: #9a97ff; --accent-soft: #232a44;
    --good: #46cd8a; --good-soft: #14301f; --bad: #ff7367; --bad-soft: #3a1a17;
    --c0: #ff5666; --c1: #22cf85; --c2: #a98bff;
    --card-bg: #232833; --card-line: #394253;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 24px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12141a; --bg2: #0d0f14; --panel: #1a1d25; --ink: #ecEae4; --ink2: #c4c1b8;
  --muted: #8f95a1; --line: #2b303a; --line2: #3b424f;
  --accent: #9a97ff; --accent-soft: #232a44;
  --good: #46cd8a; --good-soft: #14301f; --bad: #ff7367; --bad-soft: #3a1a17;
  --c0: #ff5666; --c1: #22cf85; --c2: #a98bff;
  --card-bg: #232833; --card-line: #394253;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 24px -12px rgba(0,0,0,.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
  padding: 0 16px 64px;
}
h1, h2, h3 { font-family: ui-serif, Georgia, "Times New Roman", serif; font-weight: 600; letter-spacing: -.01em; margin: 0; }
p { margin: 0 0 .7em; }
a { color: var(--accent); }
.wrap { max-width: 1080px; margin: 0 auto; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .85em; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

/* ===================== header ===================== */
header { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; padding: 26px 0 18px; }
header .title { flex: 1 1 260px; }
header h1 { font-size: 27px; }
header h1 .dot { color: var(--accent); }
header .sub { color: var(--muted); font-size: 13.5px; }
.hbtns { display: flex; gap: 8px; align-items: center; }

/* ===================== controls ===================== */
button { font: inherit; color: inherit; }
.btn {
  border: 1px solid var(--line2); background: var(--panel); color: var(--ink);
  padding: 8px 14px; border-radius: 10px; cursor: pointer; font-size: 14px;
  box-shadow: 0 1px 0 rgba(0,0,0,.02); transition: background .12s, border-color .12s, transform .06s;
}
.btn:hover { border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: var(--line); }
.btn.small { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(120,110,255,.5); } 50% { box-shadow: 0 0 0 7px rgba(120,110,255,0); } }
.iconbtn { border: 1px solid var(--line2); background: var(--panel); border-radius: 10px; width: 34px; height: 34px; cursor: pointer; display: grid; place-items: center; }
.iconbtn:hover { border-color: var(--accent); }
input[type="text"] {
  font: inherit; padding: 7px 10px; border-radius: 9px; border: 1px solid var(--line2);
  background: var(--panel); color: var(--ink); min-width: 0;
}
.switch { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; font-size: 13px; color: var(--ink2); }
.switch .track { width: 34px; height: 19px; border-radius: 99px; background: var(--line2); position: relative; transition: background .15s; flex: none; }
.switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 99px; background: var(--panel); transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.switch[aria-checked="true"] .track { background: var(--accent); }
.switch[aria-checked="true"] .track::after { transform: translateX(15px); }

/* ===================== panels ===================== */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.pad { padding: 18px; }
@media (min-width: 640px) { .pad { padding: 22px; } }

/* ===================== setup ===================== */
.choices { display: grid; gap: 14px; grid-template-columns: 1fr; margin: 0 0 20px; }
@media (min-width: 720px) { .choices { grid-template-columns: 1fr 1fr; } }
.choice { text-align: left; cursor: pointer; border: 1.5px solid var(--line); background: var(--panel); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
.choice:hover { border-color: var(--accent); }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.choice h3 { font-size: 17px; margin-bottom: 4px; }
.choice .k { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); font-weight: 600; }
.choice ul { margin: 8px 0 0; padding-left: 18px; color: var(--ink2); font-size: 13.5px; }
.choice li { margin: 2px 0; }
.modes { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 10px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 8px 14px; cursor: pointer; font-size: 14px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }

/* ===================== status bar ===================== */
.bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 0 0 14px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 5px 12px; font-size: 13px; color: var(--ink2); }
.chip b { color: var(--ink); font-weight: 600; }
.chip.ok { background: var(--good-soft); border-color: transparent; color: var(--good); }
.chip.err { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.spacer { flex: 1 1 auto; }
.msg { border-radius: 12px; padding: 12px 16px; margin: 0 0 16px; font-size: 14.5px; border: 1px solid var(--line); background: var(--panel); }
.msg.ok { background: var(--good-soft); border-color: transparent; color: var(--good); }
.msg.err { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.msg.ask { background: var(--accent-soft); border-color: transparent; }
.msg b { font-weight: 600; }
.msg .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }

/* ===================== cards ===================== */
.card { display: block; width: 100%; height: 100%; }
.cardface {
  width: var(--cw); aspect-ratio: 5 / 7; background: var(--card-bg); border: 1px solid var(--card-line);
  border-radius: 8px; padding: 3px; display: block; cursor: pointer; position: relative;
  box-shadow: 0 1px 1px rgba(0,0,0,.06);
}
.cardface:hover { border-color: var(--accent); }
.cardface.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), 0 2px 8px rgba(0,0,0,.14); transform: translateY(-2px); }
.cardface.used { opacity: .22; pointer-events: none; }
.cardface.static { cursor: default; }

/* ===================== grid ===================== */
.boards { display: flex; gap: 26px; flex-wrap: wrap; align-items: flex-start; }
.layer { }
.layer h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-family: inherit; font-weight: 600; margin-bottom: 8px; }
.grid { display: grid; grid-template-columns: repeat(3, var(--cw)); gap: 7px; }
.cell {
  width: var(--cw); aspect-ratio: 5 / 7; border-radius: 8px; padding: 0; cursor: pointer; position: relative;
  border: 1px dashed var(--line2); background: transparent;
}
.cell.filled { border: 1px solid var(--card-line); background: var(--card-bg); padding: 3px; box-shadow: 0 1px 1px rgba(0,0,0,.06); }
.cell.empty:hover { border-color: var(--accent); background: var(--accent-soft); }
.cell.target { border-color: var(--accent); background: var(--accent-soft); }
.cell.given { box-shadow: 0 0 0 2px var(--accent) inset; cursor: default; }
.cell.given::after { content: ""; position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 99px; background: var(--accent); }
.cell.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.cell.bad { border-color: var(--bad) !important; box-shadow: 0 0 0 2px var(--bad) inset; }
.cell.hl { box-shadow: 0 0 0 3px var(--accent); z-index: 2; }
.cell.hlbad { box-shadow: 0 0 0 3px var(--bad); z-index: 2; }
.cell .idx { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; color: var(--muted); font-family: ui-monospace, monospace; }

/* ===================== card picker ===================== */
.sheetwrap { position: fixed; inset: 0; z-index: 60; background: rgba(20, 16, 10, .45); display: flex; align-items: center; justify-content: center; padding: 16px; backdrop-filter: blur(2px); }
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 24px 60px -18px rgba(0,0,0,.5); padding: 18px; width: min(430px, 100%); max-height: 92vh; overflow: auto; }
.shead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.shead h3 { font-size: 18px; }
.shead .cardface { width: 52px; }
.shead .cardface.empty { border-style: dashed; background: transparent; }
.prow { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
.plabel { width: 58px; flex: none; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.popts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; flex: 1 1 auto; }
.popt { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; padding: 6px 4px; cursor: pointer;
  border: 1.5px solid var(--line2); background: var(--panel); border-radius: 11px; }
.popt:hover { border-color: var(--accent); }
.popt.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent-soft); }
.popt .pglyph { width: 46px; height: 23px; display: block; }
.pdigit { font-family: ui-serif, Georgia, serif; font-size: 23px; line-height: 1; }
.pswatch { width: 34px; height: 20px; border-radius: 5px; display: block; }
.pcap { font-size: 10.5px; color: var(--muted); letter-spacing: .01em; }
.popt.on .pcap { color: var(--ink2); }
.sfoot { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.sfoot .row { display: flex; gap: 8px; flex-wrap: wrap; }
.pnote { background: var(--accent-soft); border-radius: 10px; padding: 9px 12px; font-size: 13px; }
.pnote .row { margin-top: 8px; }
@media (max-width: 560px) {
  .sheetwrap { align-items: flex-end; padding: 0; }
  .sheet { width: 100%; max-width: none; border-radius: 18px 18px 0 0; border-bottom: 0; padding: 16px 14px calc(16px + env(safe-area-inset-bottom)); }
  .popt { min-height: 58px; }
}

/* ===================== 3-D lattice ===================== */
.boardcol { flex: 0 1 auto; min-width: 0; }
.viewbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.viewbar .seg button { padding: 6px 12px; font-size: 13px; }
.nudge { display: inline-flex; gap: 5px; align-items: center; }
.iconbtn.small { width: 28px; height: 28px; border-radius: 8px; font-size: 13px; line-height: 1; }
.scene {
  --cw: 56px;
  position: relative; width: min(660px, 100%); height: 540px; margin: 0 auto;
  perspective: 1900px; touch-action: none; cursor: grab; user-select: none;
  border: 1px solid var(--line); border-radius: 14px; background:
    radial-gradient(120% 90% at 50% 15%, var(--panel) 0%, var(--bg2) 100%);
  overflow: hidden;
}
.scene:active { cursor: grabbing; }
.scene:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cube { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d;
  transform: translate(var(--tx, 0px), var(--ty, 0px)) scale(var(--zoom)) rotateX(var(--rx)) rotateY(var(--ry)); }
.cube .cell3d { position: absolute; left: 0; top: 0; width: var(--cw); height: calc(var(--cw) * 1.4);
  margin-left: calc(var(--cw) / -2); margin-top: calc(var(--cw) * -0.7); transition: opacity .18s; }
.cube .cell3d.empty { background: var(--panel); opacity: .62; }
.cube .cell3d.empty:hover { opacity: 1; }
.plate { position: absolute; left: 0; top: 0; border: 1px dashed var(--line2);
  border-radius: 14px; opacity: .7; pointer-events: none; }
.platelab { position: absolute; top: 4px; left: 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.scene.focus .cell3d:not(.hlbad) { opacity: .13; }
.scenehint { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font-size: 11.5px; pointer-events: none; }
@media (max-width: 620px) { .scene { height: 380px; } }

/* ===================== deck ===================== */
.playarea { display: flex; gap: 30px; flex-wrap: wrap; align-items: flex-start; }
.tray { margin-top: 22px; }
.playarea .tray { margin-top: 0; flex: 1 1 320px; min-width: 0; max-width: 560px; }
.tray h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-family: inherit; font-weight: 600; margin-bottom: 8px; }
.traycards { display: flex; flex-wrap: wrap; gap: 8px; }
.deck { display: grid; grid-template-columns: max-content repeat(9, minmax(0, 1fr)); gap: 5px; align-items: center; }
.deck .dcard { width: 100%; }
.dlabel { display: flex; align-items: center; gap: 4px; padding-right: 3px; font-size: 12px; color: var(--muted); }
.dlabel b { font-weight: 600; color: var(--ink2); }
.dlabel i { width: 7px; height: 7px; border-radius: 99px; display: block; }
.deck .cardface.used { opacity: .3; background: transparent; border-style: dashed; box-shadow: none; }
/* a little air between the three count groups */
.deck > :nth-child(n+21):nth-child(-n+30), .deck > :nth-child(n+51):nth-child(-n+60) { margin-bottom: 9px; }
@media (max-width: 460px) { .deck { gap: 3px; } .dlabel { font-size: 10px; gap: 2px; } .dlabel i { width: 5px; height: 5px; } }

/* ===================== failure list ===================== */
.fails { margin-top: 20px; }
.faillist { display: flex; flex-wrap: wrap; gap: 7px; max-height: 172px; overflow: auto; padding: 2px; }
.faillist button { border: 1px solid var(--bad); background: var(--bad-soft); color: var(--bad); border-radius: 8px; padding: 5px 9px; font-size: 12.5px; cursor: pointer; text-align: left; }
.faillist button:hover { filter: brightness(1.04); }

/* ===================== projective board ===================== */
.pgcols { display: grid; gap: 22px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 900px) { .pgcols { grid-template-columns: minmax(0,1fr) 300px; } }
.pgwrap { position: relative; width: 100%; max-width: 560px; aspect-ratio: 1; margin: 0 auto; }
.pgwrap svg.pgsvg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.pgsvg .circ { fill: none; stroke: var(--line2); stroke-width: .35; stroke-dasharray: 1.6 1.6; }
.pgsvg .hlpath { fill: none; stroke: var(--accent); stroke-width: .8; stroke-linejoin: round; stroke-linecap: round; opacity: .85; }
.pgsvg .hlpath.bad { stroke: var(--bad); }
.pgnode {
  position: absolute; transform: translate(-50%, -50%); border-radius: 9px; cursor: pointer;
  border: 1px dashed var(--line2); background: var(--panel); padding: 3px;
  display: flex; gap: 2px; align-items: center; justify-content: center;
  width: 60px; height: 44px;
}
.pgnode .mini { width: 24px; aspect-ratio: 5/7; background: var(--card-bg); border: 1px solid var(--card-line); border-radius: 4px; padding: 1px; }
.pgnode .lbl { font-size: 10px; color: var(--muted); font-family: ui-monospace, monospace; }
.pgnode.filled { border-style: solid; border-color: var(--card-line); }
.pgnode.inf { border-radius: 99px; }
.pgnode:hover { border-color: var(--accent); }
.pgnode.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.pgnode.bad { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad); }
.pgnode.hl { box-shadow: 0 0 0 3px var(--accent); z-index: 3; }
.pgnode.hlbad { box-shadow: 0 0 0 3px var(--bad); z-index: 3; }
@media (max-width: 560px) { .pgnode { width: 48px; height: 36px; } .pgnode .mini { width: 19px; } }
.pgpal { display: flex; flex-wrap: wrap; gap: 7px; }
.pgitem { border: 1px solid var(--line2); background: var(--panel); border-radius: 9px; padding: 4px; cursor: pointer; display: flex; gap: 3px; }
.pgitem .mini { width: 26px; aspect-ratio: 5/7; background: var(--card-bg); border: 1px solid var(--card-line); border-radius: 4px; padding: 1px; }
.pgitem:hover { border-color: var(--accent); }
.pgitem.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.pgitem.used { opacity: .22; pointer-events: none; }
.pglines { display: flex; flex-direction: column; gap: 4px; }
.dragover { border-color: var(--accent) !important; background: var(--accent-soft) !important; }
.traycards.dragover, .pgpal.dragover, .deck.dragover { outline: 2px dashed var(--accent); outline-offset: 6px; border-radius: 10px; background: transparent !important; }
.pgline { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px; font-size: 12.5px; background: var(--panel); cursor: default; text-align: left; }
.pgline .st { font-weight: 700; width: 12px; }
.pgline.good { border-color: transparent; background: var(--good-soft); color: var(--good); }
.pgline.bad { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }

/* ===================== misc ===================== */
.centercard { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--ink2); }
.centercard .cardface { width: 44px; }
details.help { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 14px; }
details.help summary { cursor: pointer; color: var(--accent); font-size: 14px; }
details.help .body { margin-top: 10px; font-size: 14px; color: var(--ink2); max-width: 70ch; }
details.help h4 { margin: 14px 0 4px; font-size: 14px; }
.sharebox { margin-top: 14px; }
.sharebox pre { background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 12.5px; white-space: pre-wrap; margin: 0 0 10px; font-family: ui-monospace, monospace; }
footer { margin-top: 34px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; }
.stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 14px; }
.stats div b { display: block; font-size: 20px; font-family: ui-serif, Georgia, serif; }

</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="stripe0" width="11" height="11" patternUnits="userSpaceOnUse"><line x1="2.5" y1="-1" x2="2.5" y2="12" style="stroke:var(--c0);stroke-width:4"/></pattern>
  <pattern id="stripe1" width="11" height="11" patternUnits="userSpaceOnUse"><line x1="2.5" y1="-1" x2="2.5" y2="12" style="stroke:var(--c1);stroke-width:4"/></pattern>
  <pattern id="stripe2" width="11" height="11" patternUnits="userSpaceOnUse"><line x1="2.5" y1="-1" x2="2.5" y2="12" style="stroke:var(--c2);stroke-width:4"/></pattern>
  <pattern id="stripe3" width="11" height="11" patternUnits="userSpaceOnUse"><line x1="2.5" y1="-1" x2="2.5" y2="12" style="stroke:var(--ink2);stroke-width:4"/></pattern>
</defs></svg>

<div class="wrap">
  <header>
    <div class="title">
      <h1>SET<span class="dot"> · </span>Affine Geometry</h1>
      <div class="sub">Every row, column and diagonal a SET — the finite geometries AG(2,3), AG(3,3) and PG(2,3)</div>
    </div>
    <div class="hbtns">
      <button class="iconbtn" id="themebtn" data-act="theme" aria-label="switch light / dark theme" title="light / dark">☾</button>
    </div>
  </header>
  <main id="main"></main>
  <footer>
    81 SET cards = the points of AG(4,3). A SET is a line. Built to be played with a pencil-and-paper frame of mind.
  </footer>
</div>

<script>
/* =====================================================================
   SET · Affine Geometry Puzzle — core mathematics
   AG(2,3) (3x3), AG(3,3) (3x3x3) inside the 81-card SET deck = AG(4,3),
   plus the projective plane PG(2,3) of directions through a point.
   ===================================================================== */
'use strict';

/* ---------- seeded RNG (deterministic, for daily puzzles) ---------- */
function xmur3(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function () {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    h ^= h >>> 16;
    return h >>> 0;
  };
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeRng(seed) { const h = xmur3(String(seed)); h(); h(); return mulberry32(h()); }

/* ---------- vectors over F_3 ---------- */
const F3 = {
  add: (a, b) => a.map((x, i) => (x + b[i]) % 3),
  sub: (a, b) => a.map((x, i) => (x - b[i] + 3) % 3),
  scale: (s, a) => a.map(x => (x * ((s % 3) + 3)) % 3),
  neg: a => a.map(x => (3 - x) % 3),
  eq: (a, b) => a.length === b.length && a.every((x, i) => x === b[i]),
  isZero: a => a.every(x => x === 0)
};
/* little-endian base-3 encoding */
function enc(v) { let n = 0; for (let i = v.length - 1; i >= 0; i--) n = n * 3 + v[i]; return n; }
function dec(n, len) { const v = []; for (let i = 0; i < len; i++) { v.push(n % 3); n = Math.floor(n / 3); } return v; }
/* scale so the first nonzero coordinate is 1 — a canonical projective rep */
function normDir(v) {
  for (let i = 0; i < v.length; i++) {
    if (v[i] !== 0) { const inv = v[i] === 1 ? 1 : 2; return v.map(x => (x * inv) % 3); }
  }
  return v.slice();
}
/* rank of a list of F_3 vectors (Gaussian elimination) */
function rankF3(vecs) {
  if (!vecs.length) return 0;
  const m = vecs.map(v => v.slice());
  const n = m[0].length;
  let rank = 0;
  for (let col = 0; col < n && rank < m.length; col++) {
    let piv = -1;
    for (let r = rank; r < m.length; r++) if (m[r][col] !== 0) { piv = r; break; }
    if (piv < 0) continue;
    const t = m[rank]; m[rank] = m[piv]; m[piv] = t;
    const inv = m[rank][col] === 1 ? 1 : 2;
    m[rank] = m[rank].map(x => (x * inv) % 3);
    for (let r = 0; r < m.length; r++) {
      if (r !== rank && m[r][col] !== 0) {
        const f = m[r][col];
        m[r] = m[r].map((x, i) => (x - f * m[rank][i] + 9) % 3);
      }
    }
    rank++;
  }
  return rank;
}
/* every vector in the span of `dirs`, as an encoded-index Set */
function spanSet(dirs, len) {
  const out = new Set();
  const total = Math.pow(3, dirs.length);
  for (let m = 0; m < total; m++) {
    const coef = dec(m, dirs.length);
    let v = new Array(len).fill(0);
    for (let k = 0; k < dirs.length; k++) v = F3.add(v, F3.scale(coef[k], dirs[k]));
    out.add(enc(v));
  }
  return out;
}

/* ---------- the SET deck = AG(4,3) ---------- */
/* card vector = [count, color, shape, fill], each in {0,1,2}; id = enc(vector) */
const COUNT_NAMES = ['one', 'two', 'three'];
const COLOR_NAMES = ['red', 'green', 'purple'];
const SHAPE_NAMES = ['diamond', 'squiggle', 'oval'];
const FILL_NAMES = ['solid', 'striped', 'open'];

const cardVec = id => dec(id, 4);
const cardId = v => enc(v);
const thirdCard = (a, b) => F3.neg(F3.add(a, b));
const isSetTriple = (a, b, c) => F3.isZero(F3.add(F3.add(a, b), c));
const isSetIds = (a, b, c) => isSetTriple(cardVec(a), cardVec(b), cardVec(c));
function cardName(id) {
  const v = cardVec(id);
  return COUNT_NAMES[v[0]] + ' ' + COLOR_NAMES[v[1]] + ' ' + FILL_NAMES[v[3]] + ' ' +
    SHAPE_NAMES[v[2]] + (v[0] > 0 ? 's' : '');
}

/* ---------- lines of AG(dim,3) on the grid of positions ---------- */
/* Three distinct points of F_3^n are collinear exactly when they sum to 0.   */
function buildLines(dim) {
  const npos = Math.pow(3, dim);
  const lines = [];
  for (let a = 0; a < npos; a++) {
    for (let b = a + 1; b < npos; b++) {
      const va = dec(a, dim), vb = dec(b, dim);
      const c = enc(F3.neg(F3.add(va, vb)));
      if (c > b) lines.push({ cells: [a, b, c], dir: normDir(F3.sub(vb, va)) });
    }
  }
  return lines;
}

/* ---------- puzzle generation ---------- */
/* An affine dim-subspace of AG(4,3): base point + dim independent directions.
   grid(p) = base + p0*d0 + p1*d1 (+ p2*d2).  Position coords are
   [row, col] for dim 2 and [row, col, layer] for dim 3.
   The given "corner" cards sit at the origin and the dim unit positions:
   affinely independent, so no three of them form a SET, and they pin the
   affine map down completely — the rest of the grid is forced. */
function genPuzzle(dim, seed) {
  const rng = makeRng(seed);
  const base = dec(Math.floor(rng() * 81), 4);
  const dirs = [];
  while (dirs.length < dim) {
    const sp = spanSet(dirs, 4);
    let d;
    do { d = dec(Math.floor(rng() * 81), 4); } while (sp.has(enc(d)));
    dirs.push(d);
  }
  const npos = Math.pow(3, dim);
  const solution = new Array(npos);
  for (let p = 0; p < npos; p++) {
    const pv = dec(p, dim);
    let v = base.slice();
    for (let k = 0; k < dim; k++) v = F3.add(v, F3.scale(pv[k], dirs[k]));
    solution[p] = enc(v);
  }
  const given = [0];
  for (let k = 0; k < dim; k++) { const pv = new Array(dim).fill(0); pv[k] = 1; given.push(enc(pv)); }
  /* the cards the player must place, shuffled */
  const pool = [];
  for (let p = 0; p < npos; p++) if (given.indexOf(p) < 0) pool.push(solution[p]);
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
  }
  return { dim, seed: String(seed), base, dirs, solution, given, pool, lines: buildLines(dim) };
}

/* ---------- grid checking ---------- */
function checkGrid(placed, lines) {
  let filled = 0;
  for (let i = 0; i < placed.length; i++) if (placed[i] != null) filled++;
  const fails = [];
  for (let i = 0; i < lines.length; i++) {
    const c = lines[i].cells;
    if (placed[c[0]] == null || placed[c[1]] == null || placed[c[2]] == null) continue;
    if (!isSetIds(placed[c[0]], placed[c[1]], placed[c[2]])) fails.push(i);
  }
  return { filled, total: placed.length, complete: filled === placed.length, fails };
}
/* fill every cell that is forced by a line with two known cards (used in tests
   to confirm the puzzle is uniquely solvable by pure logic) */
function propagate(placed, lines) {
  const out = placed.slice();
  let changed = true;
  while (changed) {
    changed = false;
    for (const L of lines) {
      const unk = L.cells.filter(c => out[c] == null);
      if (unk.length === 1) {
        const kn = L.cells.filter(c => out[c] != null);
        out[unk[0]] = cardId(thirdCard(cardVec(out[kn[0]]), cardVec(out[kn[1]])));
        changed = true;
      }
    }
  }
  return out;
}

/* ---------- the projective plane PG(2,3) ---------- */
/* The 13 lines of AG(3,3) through the centre cell (1,1,1) are in bijection
   with the 13 directions, i.e. with the 13 points of PG(2,3); four of them
   are coplanar exactly when the four points are collinear in PG(2,3).
   The board drawn for the player is the classical model
       PG(2,3) = AG(2,3)  +  a line at infinity,
   nodes 0..8 = the 3x3 affine block, nodes 9..12 = the four directions of
   AG(2,3) (its points at infinity), and the 13th line is the circle. */
const CENTER_POS = [1, 1, 1];

function dirClasses(dim) {           /* the (3^dim - 1)/2 projective directions */
  const seen = new Set(), out = [];
  for (let i = 1; i < Math.pow(3, dim); i++) {
    const d = normDir(dec(i, dim)), k = enc(d);
    if (!seen.has(k)) { seen.add(k); out.push(d); }
  }
  return out;
}

function buildPG() {
  const nodes = [];
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) nodes.push({ id: r * 3 + c, kind: 'affine', r: r, c: c });
  const cls = [[0, 1], [1, 0], [1, 1], [1, 2]];   /* rows, columns, ↘, ↙ */
  cls.forEach((d, i) => nodes.push({ id: 9 + i, kind: 'inf', d: d }));
  const lines = [];
  for (let a = 0; a < 9; a++) {
    for (let b = a + 1; b < 9; b++) {
      const va = [Math.floor(a / 3), a % 3], vb = [Math.floor(b / 3), b % 3];
      const vc = F3.neg(F3.add(va, vb)), c = vc[0] * 3 + vc[1];
      if (c > b) {
        const d = normDir(F3.sub(vb, va));
        const ci = cls.findIndex(x => x[0] === d[0] && x[1] === d[1]);
        lines.push({ nodes: [a, b, c, 9 + ci], kind: 'affine', cls: ci, dir: d });
      }
    }
  }
  lines.push({ nodes: [9, 10, 11, 12], kind: 'inf', cls: -1 });
  return { nodes: nodes, lines: lines, cls: cls };
}

/* assignment: assign[node] = index into dirs13 (or null).
   A projective line is wrong as soon as three of its four nodes carry
   directions that do not lie in a common plane. */
function planeLineStatus(L, assign, dirs13) {
  const vs = L.nodes.map(n => assign[n]).filter(x => x != null).map(x => dirs13[x]);
  if (vs.length >= 3 && rankF3(vs) > 2) return 'bad';
  return vs.length === 4 ? 'good' : 'open';
}
function checkPlane(assign, pg, dirs13) {
  const fails = [];
  let filled = 0;
  for (let i = 0; i < 13; i++) if (assign[i] != null) filled++;
  pg.lines.forEach((L, i) => { if (planeLineStatus(L, assign, dirs13) === 'bad') fails.push(i); });
  return { filled, total: 13, complete: filled === 13, fails };
}
/* backtracking completion: returns a full valid assignment extending `assign`,
   or null if the partial assignment is already doomed. */
function solvePlane(assign, pg, dirs13, opts) {
  const a = assign.slice();
  const used = new Set(a.filter(x => x != null));
  const linesOf = [];
  for (let n = 0; n < 13; n++) linesOf.push(pg.lines.filter(L => L.nodes.indexOf(n) >= 0));
  const countAll = opts && opts.count;
  let solutions = 0, first = null;

  const fits = (n, v) => {
    a[n] = v;
    for (const L of linesOf[n]) if (planeLineStatus(L, a, dirs13) === 'bad') { a[n] = null; return false; }
    a[n] = null; return true;
  };
  const pick = () => {                       /* minimum-remaining-values */
    let best = -1, bestVals = null;
    for (let n = 0; n < 13; n++) {
      if (a[n] != null) continue;
      const vals = [];
      for (let v = 0; v < 13; v++) if (!used.has(v) && fits(n, v)) vals.push(v);
      if (bestVals == null || vals.length < bestVals.length) { best = n; bestVals = vals; }
      if (bestVals.length === 0) break;
    }
    return best < 0 ? null : { node: best, vals: bestVals };
  };
  const rec = () => {
    const s = pick();
    if (!s) { solutions++; if (!first) first = a.slice(); return !countAll; }
    for (const v of s.vals) {
      a[s.node] = v; used.add(v);
      const done = rec();
      used.delete(v); a[s.node] = null;
      if (done) return true;
    }
    return false;
  };
  rec();
  return countAll ? { count: solutions, first: first } : first;
}

/* the 13 SETs through the centre of a solved 3-D grid, one per direction */
function centreSets(puzzle) {
  const dirs13 = dirClasses(3);
  return dirs13.map((d, i) => {
    const cells = [0, 1, 2].map(t => enc(F3.add(CENTER_POS, F3.scale(t, d))));
    return { idx: i, dir: d, cells: cells, cards: cells.map(c => puzzle.solution[c]) };
  });
}

/* ---------- exports for the node test harness ---------- */
if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    F3, enc, dec, normDir, rankF3, spanSet, makeRng,
    cardVec, cardId, thirdCard, isSetTriple, isSetIds, cardName,
    buildLines, genPuzzle, checkGrid, propagate,
    dirClasses, buildPG, checkPlane, planeLineStatus, solvePlane, centreSets, CENTER_POS
  };
}

/* =====================================================================
   SET · Affine Geometry Puzzle — interface
   ===================================================================== */
(function () {
  'use strict';

  /* ---------------- tiny helpers ---------------- */
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const pad2 = n => String(n).padStart(2, '0');
  const fmtMs = ms => { if (ms == null) return '—'; const s = Math.round(ms / 1000); return Math.floor(s / 60) + ':' + pad2(s % 60); };
  const store = {
    get(k, d) { try { const v = localStorage.getItem('setaffine.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('setaffine.' + k, JSON.stringify(v)); } catch (e) { } }
  };
  function todayStr() { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function randSeed() { return Math.random().toString(36).slice(2, 8); }

  /* ---------------- card drawing ---------------- */
  const SYM = [
    /* diamond  */ 'M50 3 L96 25 L50 47 L4 25 Z',
    /* squiggle */ 'M9 33 C1 13 20 1 43 7 C61 12 82 17 92 8 C99 28 79 46 55 39 C37 34 18 25 9 33 Z',
    /* oval     */ 'M25 3 H75 A22 22 0 0 1 75 47 H25 A22 22 0 0 1 25 3 Z'
  ];
  function cardSVG(id) {
    const v = cardVec(id), n = v[0] + 1, col = v[1], sh = v[2], fl = v[3];
    const ys = n === 1 ? [55] : n === 2 ? [30, 80] : [5, 55, 105];
    let g = '';
    for (const y of ys) {
      const fill = fl === 0 ? 'var(--c' + col + ')' : fl === 1 ? 'url(#stripe' + col + ')' : 'none';
      g += '<g transform="translate(10 ' + y + ') scale(.8)"><path d="' + SYM[sh] +
        '" style="fill:' + fill + ';stroke:var(--c' + col + ');stroke-width:4.5;stroke-linejoin:round"/></g>';
    }

  /* ---------------- labels ---------------- */

  function label2(dir, cells) {
    if (dir[0] === 0) return 'Row ' + (cells[0][0] + 1);
    if (dir[1] === 0) return 'Column ' + (cells[0][1] + 1);
    if (dir[0] === 1 && dir[1] === 1) { const k = ((cells[0][1] - cells[0][0]) % 3 + 3) % 3; return k === 0 ? 'Main diagonal ↘' : 'Broken diagonal ↘'; }

  }

    if (dim === 2) return label2(line.dir, cells);
    const d = line.dir;
    if (d[2] === 0) return 'Layer ' + (cells[0][2] + 1) + ' · ' + label2([d[0], d[1]], cells.map(c => [c[0], c[1]]));
    if (d[0] === 0 && d[1] === 0) return 'Through the layers';
    if (d[0] === 0 || d[1] === 0) return 'Cross-layer diagonal';

    [0, 90, 45, 135].forEach(a => { const t = a * Math.PI / 180; p.push({ x: cx + R * Math.cos(t), y: cy + R * Math.sin(t) }); });
    return p;
  })();
  const PGPATH = PG.lines.map(L => {

      return 'M' + (cx + R) + ' ' + cy + ' A' + R + ' ' + R + ' 0 1 1 ' + (cx - R) + ' ' + cy + ' A' + R + ' ' + R + ' 0 1 1 ' + (cx + R) + ' ' + cy;
    }
    const start = Math.min(L.nodes[0], L.nodes[1], L.nodes[2]);
    const v0 = [Math.floor(start / 3), start % 3];
    const seq = [0, 1, 2].map(t => ((v0[0] + t * L.dir[0]) % 3) * 3 + ((v0[1] + t * L.dir[1]) % 3));
    const pts = seq.map(n => PGPOS[n]), inf = PGPOS[L.nodes[3]];
    let d = 'M' + pts[0].x + ' ' + pts[0].y;
    for (let i = 1; i < 3; i++) d += ' L' + pts[i].x + ' ' + pts[i].y;
    const last = pts[2], mx = (last.x + inf.x) / 2, my = (last.y + inf.y) / 2;
    d += ' Q' + (mx - (inf.y - last.y) * .22) + ' ' + (my + (inf.x - last.x) * .22) + ' ' + inf.x + ' ' + inf.y;
    return d;
  });
  const pgNodeName = n => n < 9 ? 'affine point (' + (Math.floor(n / 3) + 1) + ',' + (n % 3 + 1) + ')'
    : 'point at infinity ' + ['→ rows', '↓ columns', '↘ diagonals', '↙ diagonals'][n - 9];
  const pgLineName = i => PG.lines[i].kind === 'inf' ? 'The line at infinity'
    : 'Line ' + (i + 1) + ' · ' + label2(PG.lines[i].dir, PG.lines[i].nodes.slice(0, 3).map(n => [Math.floor(n / 3), n % 3])) + ' + ∞';

  /* ---------------- state ---------------- */
  const S = {
    view: 'setup', dim: 2, mode: 'daily', seedIn: '',
    picker: null, view3: '3d', v3: { rx: -24, ry: -32, zoom: 1 }, noClick: 0,
    puzzle: null, placed: [], sel: null, phase: 'grid',
    submitted: false, hl: null, revealed: false,
    live: { grid: false, plane: true },
    plane: { assign: [], sets: [], sel: null, submitted: false, hl: null },
    stats: {}, hist: [], drag: null, copied: false
  };

  /* ---------------- puzzle lifecycle ---------------- */
  function startPuzzle(dim, mode, seed) {
    S.dim = dim; S.mode = mode;
    const sd = seed || (mode === 'daily' ? 'daily-' + todayStr() + '-d' + dim : 'r' + randSeed() + '-d' + dim);
    S.puzzle = genPuzzle(dim, sd);
    S.placed = new Array(Math.pow(3, dim)).fill(null);
    S.puzzle.given.forEach(p => S.placed[p] = S.puzzle.solution[p]);
    S.sel = null; S.picker = null; S.phase = 'grid'; S.submitted = false; S.hl = null; S.revealed = false;
    S.hist = []; S.copied = false;
    S.plane = { assign: new Array(13).fill(null), sets: dim === 3 ? centreSets(S.puzzle) : [], sel: null, submitted: false, hl: null };
    S.stats = { t0: null, gridMs: null, pT0: null, planeMs: null, hintsG: 0, hintsP: 0, checksG: 0, checksP: 0 };
    S.view = 'game';
    try { history.replaceState(null, '', '#p=' + encodeURIComponent(sd) + '&d=' + dim); } catch (e) { }
    render();
  }
  const startClock = () => { if (S.stats.t0 == null) S.stats.t0 = Date.now(); };
  const elapsed = () => S.stats.t0 == null ? 0 : (S.stats.gridMs != null && S.phase !== 'grid' ? S.stats.gridMs : Date.now() - S.stats.t0);
  const snapshot = () => { S.hist.push(JSON.stringify([S.placed, S.plane.assign])); if (S.hist.length > 300) S.hist.shift(); };
  function undo() {
    const h = S.hist.pop(); if (!h) return;
    const v = JSON.parse(h); S.placed = v[0]; S.plane.assign = v[1];
    S.submitted = false; S.plane.submitted = false; S.sel = null; S.plane.sel = null;
    if (S.phase === 'gridDone') S.phase = 'grid';
    if (S.phase === 'planeDone') S.phase = 'plane';

    snapshot(); startClock();

    S.placed[pos] = card; S.sel = null; S.submitted = false; render();

  function onCell(pos) {
    const given = S.puzzle.given.indexOf(pos) >= 0;
    const sel = S.sel;
    if (sel && sel.kind === 'tray') { if (given) { S.sel = null; return render(); } return placeAt(pos, sel.card); }
    if (given) { S.sel = null; return render(); }
    openPicker(pos);
  }
